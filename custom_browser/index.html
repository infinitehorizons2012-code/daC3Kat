<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Trình duyệt Học tập Kat</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    #toolbar {
      display: flex;
      padding: 10px;
      background-color: #f0f0f0;
      border-bottom: 1px solid #ccc;
      align-items: center;
      gap: 10px;
    }
    #url-bar {
      flex-grow: 1;
      padding: 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 15px;
      cursor: pointer;
      background-color: #0078d7;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
    }
    button:hover {
      background-color: #005a9e;
    }
    #btn-khan {
      background-color: #14bf96;
    }
    webview {
      flex-grow: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btn-back">&larr;</button>
    <button id="btn-forward">&rarr;</button>
    <button id="btn-reload">&#x21bb;</button>
    <input type="text" id="url-bar" value="https://www.khanacademy.org/">
    <button id="btn-go">Đi</button>
    <button id="btn-khan">Tính % Điểm Khan</button>
  </div>
  
  <webview id="browser-view" src="https://www.khanacademy.org/" preload="scripts/khan_extractor.js"></webview>

  <script>
    const webview = document.getElementById('browser-view');
    const urlBar = document.getElementById('url-bar');
    const btnGo = document.getElementById('btn-go');
    const btnKhan = document.getElementById('btn-khan');
    const btnBack = document.getElementById('btn-back');
    const btnForward = document.getElementById('btn-forward');
    const btnReload = document.getElementById('btn-reload');

    // Chuyển trang
    btnGo.addEventListener('click', () => {
      let url = urlBar.value;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      webview.src = url;
    });

    urlBar.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        btnGo.click();
      }
    });

    // Cập nhật URL bar khi webview thay đổi trang
    webview.addEventListener('did-navigate', (e) => {
      urlBar.value = e.url;
    });
    webview.addEventListener('did-navigate-in-page', (e) => {
      urlBar.value = e.url;
    });

    // Điều hướng cơ bản
    btnBack.addEventListener('click', () => { if (webview.canGoBack()) webview.goBack(); });
    btnForward.addEventListener('click', () => { if (webview.canGoForward()) webview.goForward(); });
    btnReload.addEventListener('click', () => { webview.reload(); });

    // Gửi yêu cầu tính điểm xuống webview
    btnKhan.addEventListener('click', () => {
      webview.send('extract-khan-score');
    });

    // Nhận thông báo từ nội dung trang web (khan_extractor.js gửi lên)
    webview.addEventListener('ipc-message', (event) => {
      if (event.channel === 'khan-score-result') {
        const score = event.args[0];
        alert("Điểm Khan Academy hiện tại: " + JSON.stringify(score));
        // Gọi API của Electron (đã expose qua preload.js của window chính) để lưu vào DB
        if (window.electronAPI) {
          window.electronAPI.saveKhanScore(score);
        }
      }
    });
  </script>
</body>
</html>
