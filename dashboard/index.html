<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Quản lý Kat</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Load Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>DA C3 Kat - Homeschooling Dashboard</h1>
        <p>Theo dõi thời gian sử dụng máy tính và tiến độ học tập</p>
    </header>

    <main>
        <section class="card">
            <h2>Thời gian sử dụng máy tính hôm nay</h2>
            <div class="chart-container">
                <canvas id="activityChart"></canvas>
            </div>
        </section>

        <section class="card">
            <h2>Tiến độ Khan Academy</h2>
            <ul id="khan-list" class="data-list">
                <li>Đang tải dữ liệu...</li>
            </ul>
        </section>

        <section class="card">
            <h2>Ghi chú & Dịch thuật (Gần đây)</h2>
            <ul id="notes-list" class="data-list">
                <li>Đang tải dữ liệu...</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 DA C3 Kat Project.</p>
    </footer>

    <!-- Khởi tạo Supabase client và gọi dữ liệu -->
    <script src="app.js"></script>
</body>
</html>
