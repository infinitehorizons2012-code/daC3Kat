name = "gtd-space-station-168-api"
main = "src/index.js"
compatibility_date = "2024-08-10"
compatibility_flags = [ "nodejs_compat" ]

[[d1_databases]]
binding = "DB"
database_name = "gtd-db"
database_id = "00000000-0000-0000-0000-000000000000" # NOTE: User must replace this with real ID from `wrangler d1 create`
migrations_dir = "./migrations"

[observability]
enabled = true
